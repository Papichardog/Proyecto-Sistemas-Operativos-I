# Grupo de servidores entre los que Nginx reparte el tráfico.
# Por defecto usa round-robin: alterna una petición a cada uno.
upstream citas_backend {
    server app1:8080;
    server app2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://citas_backend;

        # Sin estos headers, tu Spring Boot vería todas las peticiones
        # como si vinieran de Nginx (127.0.0.1) en vez del navegador real.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
