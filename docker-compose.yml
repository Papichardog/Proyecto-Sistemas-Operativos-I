services:

  db:
    image: postgres:latest
    container_name: citas-db
    environment:
      POSTGRES_DB: citas_medicas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 1. Agregamos esta línea para forzar la ruta compatible con Postgres 18+
      PGDATA: /var/lib/postgresql
    volumes:
      # 2. Corregimos el volumen quitándole el "/data" del final
      - citas_db_data:/var/lib/postgresql
      # Postgres ejecuta automáticamente cualquier .sql que encuentre acá
      # SOLO la primera vez que arranca (cuando el volumen está vacío).
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citas_medicas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app1:
    build: .
    container_name: citas-app1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/citas_medicas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  app2:
    build: .
    container_name: citas-app2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/citas_medicas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: citas-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  citas_db_data:
