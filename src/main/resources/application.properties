# Configuración general de la aplicación
# Nombre lógico de la aplicación (se usa en logs, actuator, etc.)
spring.application.name=com.umg.citasmedicas

# Configuración de la base de datos (PostgreSQL)
# URL de conexión a la base de datos local
spring.datasource.url=jdbc:postgresql://localhost:5432/citas_medicas
# Usuario de la base de datos
spring.datasource.username=postgres
# Contraseña del usuario de la base de datos
spring.datasource.password=tuclave

# Configuración de JPA / Hibernate
# validate: solo valida que el esquema coincida con las entidades,
# no crea ni modifica tablas automáticamente.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en consola el SQL generado por Hibernate (útil en desarrollo).
spring.jpa.show-sql=true
